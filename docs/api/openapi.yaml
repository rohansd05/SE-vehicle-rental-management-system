          description: ''
  /api/v1/rentals/branch-bookings/:
    get:
      operationId: api_v1_rentals_branch_bookings_list
      description: 'Confirmed bookings collected at the caller''s branch, earliest
        first: `when=today` (default) or `when=upcoming`. With `q`, finds a Confirmed
        booking on any date by its booking reference, its pickup code or the customer''s
        mobile number; `when` is then ignored. The pickup code itself is never returned.'
      summary: Collections at your branch, or find a booking
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: when
        schema:
          type: string
          enum:
          - today
          - upcoming
      tags:
      - Handover
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchBookingList'
          description: ''
  /api/v1/rentals/handovers/{id}/:
    get:
      operationId: api_v1_rentals_handovers_retrieve
      description: The booking, the customer's licence, the accessories to issue (BR-7),
        the photo sides required and the rental terms to sign. `refusals` lists every
        condition that blocks the handover (licence, statutory documents, Unsafe vehicle,
        payment); `can_hand_over` is true when there are none. Once handed over, `report`
        holds the signed condition report.
      summary: A booking's handover checklist (UC 7 steps 1 and 2, Handover.Refuse)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Handover
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverDetail'
          description: ''
  /api/v1/rentals/handovers/{id}/complete/:
    post:
      operationId: api_v1_rentals_handovers_complete_create
      description: 'Handover.Checklist, Handover.Sign and Handover.Activate in one
        transaction: the condition report with one photo of each side and the customer''s
        signature is stored and can never be altered, the booking becomes Active with
        the handover time, the vehicle goes On Rent, everything is audited and a copy
        is e-mailed to the customer. If a condition is not met the answer is 409 with
        `refusals`.'
      summary: Record, sign and complete a handover (BranchStaff.handover_vehicle())
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Handover
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Handover'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverRefused'
          description: Handover.Refuse
components:
  schemas:
    AccessToken:
      type: object
      description: 'Sign-in and refresh response (D21): the refresh token is in the
        cookie only.'
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access
      - user
    Accessory:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
        quantity:
          type: integer
          maximum: 99
          minimum: 1
      required:
      - name
      - quantity
    AddOn:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        daily_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        vehicle_type:
          type: string
          readOnly: true
          description: Car or Two-Wheeler; blank when offered with any vehicle.
      required:
      - daily_rate
      - id
      - name
      - vehicle_type
    AddOnCharge:
      type: object
      properties:
        add_on_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        daily_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        days:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - add_on_id
      - amount
      - daily_rate
      - days
      - name
      - quantity
    AddOnRequest:
      type: object
      properties:
        add_on:
          type: integer
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - add_on
    AvailableVehicle:
      type: object
      description: 'One search result: the specification a customer chooses by (Search.Filter
        fields).'
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: string
          maxLength: 64
        model:
          type: string
          maxLength: 64
        year:
          type: integer
          maximum: 2100
          minimum: 1990
        colour:
          type: string
          maxLength: 32
        fuel_type:
          $ref: '#/components/schemas/FuelTypeEnum'
        vehicle_type:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        category_id:
          type: integer
          readOnly: true
        home_branch:
          type: string
          readOnly: true
        home_branch_id:
          type: integer
          readOnly: true
        transmission:
          type: string
          nullable: true
          readOnly: true
        seating_capacity:
          type: integer
          nullable: true
          readOnly: true
        engine_cc:
          type: integer
          nullable: true
          readOnly: true
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        last_service_date:
          type: string
          format: date
          nullable: true
        estimate:
          allOf:
          - $ref: '#/components/schemas/Estimate'
          nullable: true
          readOnly: true
      required:
      - average_rating
      - brand
      - category
      - category_id
      - colour
      - engine_cc
      - estimate
      - fuel_type
      - home_branch
      - home_branch_id
      - id
      - model
      - seating_capacity
      - transmission
      - vehicle_type
      - year
