<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F5866" />
    <title>Offline - Veyora</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- Shown by the service worker (sw.js) when a page cannot be loaded. Self-contained:
         the colours are the canvas, ink, ink-muted and primary tokens of src/index.css. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: #f7f5f0;
        color: #1b1c1d;
        font: 400 1rem/1.625 'IBM Plex Sans Variable', 'IBM Plex Sans', system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
      }
      img {
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 12px;
      }
      h1 {
        margin: 24px 0 8px;
        font: 700 2rem/1.2 'Schibsted Grotesk Variable', system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: #55534e;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 8px;
        background: #0f5866;
        color: #ffffff;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        background: #0b4753;
      }
      a:focus-visible {
        outline: 2px solid #0f5866;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Veyora needs an internet connection to show vehicles, bookings and payments. Check your connection, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
