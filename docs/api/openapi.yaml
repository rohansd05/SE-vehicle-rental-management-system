    post:
      operationId: api_v1_rentals_handovers_complete_create
      description: 'Handover.Checklist, Handover.Sign and Handover.Activate in one
        transaction: the condition report with one photo of each side and the customer''s
        signature is stored and can never be altered, the booking becomes Active with
        the handover time, the vehicle goes On Rent, everything is audited and a copy
        is e-mailed to the customer. If a condition is not met the answer is 409 with
        `refusals`.'
      summary: Record, sign and complete a handover (BranchStaff.handover_vehicle())
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
