      type: object
      description: |-
        Handover.Checklist and Handover.Sign, sent as multipart/form-data.

        `accessories` and `damage_marks` are JSON arrays in their form fields.
        One photo of each side is required (photo_front, photo_rear, photo_left,
        photo_right: the four sides of HANDOVER_PHOTO_SIDES); extra_photos are
        optional. `signature` is the customer's signature drawn on the branch
        device, as a PNG.
      properties:
        odometer_reading:
          type: integer
          minimum: 0
        fuel_level:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        accessories: {}
        damage_marks: {}
        photo_front:
          type: string
          format: uri
        photo_rear:
          type: string
          format: uri
        photo_left:
          type: string
          format: uri
        photo_right:
          type: string
          format: uri
        extra_photos:
          type: array
          items:
            type: string
            format: uri
        signature:
          type: string
          format: uri
      required:
      - fuel_level
      - odometer_reading
      - photo_front
      - photo_left
      - photo_rear
      - photo_right
      - signature
