          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverRefused'
          description: Handover.Refuse
