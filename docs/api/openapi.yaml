        security_deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        discount_code:
          type: string
          readOnly: true
          default: ''
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        terms_accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        safety_notice_acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        invoice_number:
          type: string
          nullable: true
          readOnly: true
