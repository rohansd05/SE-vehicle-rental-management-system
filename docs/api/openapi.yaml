      description: The booking, the customer's licence, the accessories to issue (BR-7),
        the photo sides required and the rental terms to sign. `refusals` lists every
        condition that blocks the handover (licence, statutory documents, Unsafe vehicle,
        payment); `can_hand_over` is true when there are none. Once handed over, `report`
        holds the signed condition report.
      summary: A booking's handover checklist (UC 7 steps 1 and 2, Handover.Refuse)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Handover
