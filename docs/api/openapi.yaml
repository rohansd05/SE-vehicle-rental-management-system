          readOnly: true
        document_number:
          type: string
          readOnly: true
        valid_from:
          type: string
          format: date
          readOnly: true
          nullable: true
        expiry_date:
          type: string
          format: date
          readOnly: true
        state:
          type: string
          readOnly: true
        current:
