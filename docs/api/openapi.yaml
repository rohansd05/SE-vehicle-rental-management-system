components:
  schemas:
    AccessToken:
      type: object
      description: 'Sign-in and refresh response (D21): the refresh token is in the
        cookie only.'
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access
      - user
    Accessory:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
        quantity:
          type: integer
          maximum: 99
          minimum: 1
      required:
      - name
      - quantity
    AddOn:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        daily_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        vehicle_type:
          type: string
          readOnly: true
          description: Car or Two-Wheeler; blank when offered with any vehicle.
      required:
      - daily_rate
      - id
      - name
      - vehicle_type
    AddOnCharge:
      type: object
      properties:
        add_on_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        daily_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        days:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - add_on_id
      - amount
      - daily_rate
      - days
      - name
      - quantity
    AddOnRequest:
      type: object
      properties:
        add_on:
          type: integer
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - add_on
    AdminAddOn:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        daily_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        vehicle_type:
          type: string
          description: Car, Two-Wheeler, or empty for any.
        is_active:
          type: boolean
      required:
      - daily_rate
      - id
      - name
    AdminArea:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        pincode:
          type: string
          pattern: ^[0-9]{6}$
          maxLength: 6
        locality:
          type: string
          maxLength: 100
      required:
      - id
      - pincode
    AdminBranch:
      type: object
      properties:
        branch_id:
          type: integer
          readOnly: true
        branch_name:
          type: string
          maxLength: 100
        address:
          type: string
        serviceable_areas:
          type: array
          items:
            $ref: '#/components/schemas/AdminArea'
          readOnly: true
        vehicle_count:
          type: integer
          readOnly: true
      required:
      - address
      - branch_id
      - branch_name
      - serviceable_areas
      - vehicle_count
    AdminCustomer:
      type: object
      description: A customer, with the latest blacklisting (BR-4) taken from the
        audit log.
      properties:
        customer_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
        is_blacklisted:
          type: boolean
          readOnly: true
        outstanding_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        blacklist_reason:
          type: string
          nullable: true
          readOnly: true
        blacklisted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        blacklisted_by:
          type: string
          nullable: true
          readOnly: true
      required:
      - blacklist_reason
      - blacklisted_at
      - blacklisted_by
      - customer_id
      - email
      - is_blacklisted
      - mobile_no
      - name
      - outstanding_due
    AdminCustomerDetail:
      type: object
      description: A customer, with the latest blacklisting (BR-4) taken from the
        audit log.
      properties:
        customer_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
        is_blacklisted:
          type: boolean
          readOnly: true
        outstanding_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        blacklist_reason:
          type: string
          nullable: true
          readOnly: true
        blacklisted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        blacklisted_by:
          type: string
          nullable: true
          readOnly: true
        open_bookings:
