        clearance_requested_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_by:
          type: string
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
