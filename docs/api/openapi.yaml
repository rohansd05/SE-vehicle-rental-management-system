openapi: 3.0.3
info:
  title: Vehicle Rental Management System API
  version: 1.0.0
  description: REST + JSON API documented with OpenAPI 3.0 (CO-4).
paths:
  /api/v1/admin/customers/:
    get:
      operationId: api_v1_admin_customers_list
      description: 'BR-4: customers, to find one to blacklist, or the blacklist itself.'
      summary: Customers and the blacklist (BR-4)
      parameters:
      - in: query
        name: blacklisted
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, e-mail or mobile
      tags:
      - Users and blacklist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCustomerList'
          description: ''
  /api/v1/admin/customers/{id}/:
    get:
      operationId: api_v1_admin_customers_retrieve
      summary: A customer with their Confirmed and Active bookings
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users and blacklist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerDetail'
          description: ''
  /api/v1/admin/customers/{id}/blacklist/:
    post:
      operationId: api_v1_admin_customers_blacklist_create
      description: New bookings are refused from now on. The answer lists the customer's
        Confirmed bookings, to decide on each (UC 12 extension 2a), and Active ones
        (return pending).
      summary: Blacklist a customer with the reason (BR-4, UC 12 step 2)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users and blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reason'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reason'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/admin/customers/{id}/bookings/{booking_id}/cancel/:
    get:
      operationId: api_v1_admin_customers_bookings_cancel_retrieve
      description: |-
        UC 12 extension 2a: cancel one Confirmed booking of a blacklisted customer,
        through R2's cancellation (BR-8).
      summary: The refund if this booking is cancelled now (R2, BR-8)
      parameters:
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users and blacklist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationQuote'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
    post:
      operationId: api_v1_admin_customers_bookings_cancel_create
      description: 'SE-9: the Administrator''s password. `expected_refund` is the
        total shown; 409 `refund_changed` if BR-8 now gives another amount. An Active
        booking is never cancelled here (409 `invalid_state`).'
      summary: Cancel the booking (R2's cancel_booking(), BR-8)
      parameters:
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users and blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBooking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelBooking'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenBooking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/admin/customers/{id}/lift-blacklist/:
    post:
      operationId: api_v1_admin_customers_lift_blacklist_create
      summary: Take a customer off the blacklist, with the reason
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users and blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reason'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reason'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: api_v1_admin_users_list
      description: 'Fleet.Users: Branch Staff, Maintenance Technician and Branch Manager
        accounts.'
      summary: Staff accounts (Fleet.Users)
      parameters:
      - in: query
        name: is_active
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, e-mail or mobile
      - in: query
        name: role
        schema:
          type: string
        description: BRANCH_STAFF, MAINTENANCE_TECHNICIAN or BRANCH_MANAGER
      tags:
      - Users and blacklist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffAccountList'
          description: ''
    post:
      operationId: api_v1_admin_users_create
      description: Branch Staff and Branch Managers need a `branch`, a technician
        a `workshop`. The password is the first one; the user may change it after
        signing in.
      summary: Create a staff account (Fleet.Users, UC 12 step 1)
      tags:
      - Users and blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: api_v1_admin_users_retrieve
      summary: A staff account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users and blacklist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
          description: ''
    patch:
      operationId: api_v1_admin_users_partial_update
      summary: Edit a staff account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users and blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaffUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStaffUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaffUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/admin/users/{id}/disable/:
    post:
      operationId: api_v1_admin_users_disable_create
      description: Every session ends at once and sign-in is refused; past actions
        stay.
      summary: Disable a staff account (Fleet.Users)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users and blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reason'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reason'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/admin/users/{id}/enable/:
    post:
      operationId: api_v1_admin_users_enable_create
      summary: Re-enable a staff account (Fleet.Users)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users and blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reason'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reason'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/audit/:
    get:
      operationId: api_v1_audit_list
      description: Filter with `actor` (part of a name or e-mail, or `system`), `action`,
        `entity_type`, `entity_id`, and `date_from` / `date_to` (local dates).
      summary: Read the audit log (Fleet.Audit)
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: entity_id
        schema:
          type: string
      - in: query
        name: entity_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Audit log
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
  /api/v1/audit/filters/:
    get:
      operationId: api_v1_audit_filters_retrieve
      description: The actions and entity types the caller's entries hold, for the
        filter lists.
      summary: Actions and entity types to filter the audit log by
      tags:
      - Audit log
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditFilterOptions'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: Returns the access token (5 minutes) and the user, and sets the
        refresh cookie (30 minutes). The refresh token is never in a response body
        (D21). It is set as the httpOnly, SameSite=Strict cookie `vrms_refresh`, scoped
        to /api/v1/auth/, which the browser sends back automatically. Keep the access
        token in memory only.
      summary: Sign in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              SignIn:
                value:
                  email: customer@vrms.test
                  password: Demo@1234
                summary: Sign in
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Account locked (SE-8)
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: No request body and no access token needed. Blacklists the refresh
        token in the cookie, if any, and always clears the cookie. The refresh token
        is never in a response body (D21). It is set as the httpOnly, SameSite=Strict
        cookie `vrms_refresh`, scoped to /api/v1/auth/, which the browser sends back
        automatically. Keep the access token in memory only.
      summary: Sign out
      tags:
      - Authentication
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change/:
    post:
      operationId: api_v1_auth_password_change_create
      description: Change the password; every session ends and the user signs in again.
      summary: Change password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
            examples:
              ChangePassword:
                value:
                  current_password: Demo@1234
                  new_password: N3w!Passw0rd-2026
                summary: Change password
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          description: Invalid
  /api/v1/auth/refresh/:
    post:
      operationId: api_v1_auth_refresh_create
      description: No request body. Reads the refresh cookie, blacklists it, sets
        a new one and returns a new access token and the user (also used to restore
        a session when the page loads). 401 with code `session_ended` when the cookie
        is missing, expired or already used; the cookie is then cleared. The refresh
        token is never in a response body (D21). It is set as the httpOnly, SameSite=Strict
        cookie `vrms_refresh`, scoped to /api/v1/auth/, which the browser sends back
        automatically. Keep the access token in memory only.
      summary: Refresh the access token
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      description: 'SE-7: create an inactive customer account and send an OTP by SMS.'
      summary: Register as a customer
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              Register:
                value:
                  email: asha@example.com
                  password: Str0ng!Passw0rd
                  name: Asha Rao
                  mobile_no: '+919812345678'
                  address: 14 Hill Road, Bandra (W), Mumbai 400050
                  date_of_birth: '1996-04-12'
                  emergency_contact_name: Ravi Rao
                  emergency_contact_mobile: '+919812300000'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          description: Invalid
  /api/v1/auth/resend-otp/:
    post:
      operationId: api_v1_auth_resend_otp_create
      description: Send a new registration code; the previous one stops working.
      summary: Resend the registration OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
            examples:
              Resend:
                value:
                  email: asha@example.com
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Email'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Email'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/verify-otp/:
    post:
      operationId: api_v1_auth_verify_otp_create
      description: 'SE-7: verify the registration code and activate the account.'
      summary: Verify the registration OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
            examples:
              Verify:
                value:
                  email: asha@example.com
                  code: '123456'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: api_v1_bookings_list
      description: History.View (GET, newest pickup first) and Book.Create (POST,
        customers only).
      summary: List bookings (History.View, History.Privacy)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: pickup_from
        schema:
          type: string
          format: date
      - in: query
        name: pickup_to
        schema:
          type: string
          format: date
      - in: query
        name: reference
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - Active
          - Cancelled
          - Completed
          - Confirmed
          - Draft
          - No-show
          - Pending Payment
        description: |-
          * `Draft` - Draft
          * `Pending Payment` - Pending Payment
          * `Confirmed` - Confirmed
          * `Active` - Active
          * `Completed` - Completed
          * `Cancelled` - Cancelled
          * `No-show` - No-show
      - in: query
        name: vehicle_type
        schema:
          type: string
          enum:
          - Car
          - Two-Wheeler
        description: |-
          * `Car` - Car
          * `Two-Wheeler` - Two-Wheeler
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: api_v1_bookings_create
      description: 'Exp 4 sequence 1: checks the period (BR-5), the terms (Book.Quote.Terms,
        SA-1), eligibility (Licence.is_valid(): BR-2, BR-3, BR-4), availability (Vehicle.check_availability(),
        BR-1) and prices it (Tariff.calculate_price(), BR-6). The booking is Pending
        Payment with a 15-minute hold (Book.Hold). Refusals: 400 with `code` licence_not_verified,
        licence_expired, licence_expires_before_return, licence_category, under_age,
        customer_blacklisted or outstanding_due; 409 `vehicle_unavailable` or `service_overdue`
        (SA-2). With the doorstep delivery add-on, `delivery_address` and a `delivery_pincode`
        in the branch''s serviceable areas are required (Book.Deliver.Location); a
        refusal is a 400 on that field.'
      summary: Create a booking and hold the vehicle (Booking.create_booking())
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBooking'
            examples:
              TwoDaysWithAChildSeat:
                value:
                  vehicle: 12
                  pickup_datetime: '2026-10-20T04:30:00Z'
                  return_datetime: '2026-10-22T04:30:00Z'
                  add_ons:
                  - add_on: 3
                    quantity: 1
                  discount_code: WELCOME10
                  terms_accepted: true
                  safety_notice_acknowledged: false
                summary: Two days with a child seat
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateBooking'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: api_v1_bookings_retrieve
      summary: A booking with its itemised price
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    get:
      operationId: api_v1_bookings_cancel_retrieve
      description: Book.Cancel and Book.Cancel.Release (Exp 3 Booking.cancel_booking()).
      summary: The refund if this booking is cancelled now (Book.Cancel, BR-8)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
