                  severity: High
                  reported_problem: Brake pedal feels soft; pulls to the left under
                    braking.
                  flag_unsafe: true
                summary: Report a fault
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
