        * `Handover` - Handover
        * `Return` - Return
    RoleEnum:
      enum:
      - CUSTOMER
      - BRANCH_STAFF
      - MAINTENANCE_TECHNICIAN
      - ADMINISTRATOR
      - BRANCH_MANAGER
      type: string
      description: |-
        * `CUSTOMER` - Customer
        * `BRANCH_STAFF` - Branch Staff
        * `MAINTENANCE_TECHNICIAN` - Maintenance Technician
        * `ADMINISTRATOR` - Administrator
        * `BRANCH_MANAGER` - Branch Manager
    ScheduleConflict:
      type: object
