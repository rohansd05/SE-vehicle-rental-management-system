    PayBooking:
      type: object
      description: |-
        Pay.Method and Pay.Authorize with a gateway token (CO-2: never card details); SE-9.

        card: a token from the hosted fields. online: a D6 channel (UPI, net
        banking, wallet) and its token. cash: BR-9, paid at the branch on
        collection; no token.
      properties:
        method:
          allOf:
          - $ref: '#/components/schemas/PayBookingMethodEnum'
          default: card
        payment_token:
          type: string
          default: ''
          description: 'Token from the gateway''s hosted fields. Sandbox: tok_visa,
            tok_decline.'
          maxLength: 255
        channel:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/ChannelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        upi_id:
          type: string
          default: ''
          pattern: ^[A-Za-z0-9._-]{2,64}@[A-Za-z0-9]{2,32}$
        idempotency_key:
          type: string
          description: 'Pay.Idempotent: one key per payment attempt; repeating it
            never charges twice.'
          pattern: ^[A-Za-z0-9_-]{8,40}$
        password:
          type: string
          writeOnly: true
          description: 'SE-9: re-authentication before payment.'
      required:
      - idempotency_key
      - password
    PayBookingMethodEnum:
      enum:
      - card
      - online
      - cash
      type: string
      description: |-
        * `card` - card
        * `online` - online
        * `cash` - cash
    PayDue:
      type: object
      description: 'Pay.Method: a card token, or an on-line channel (D6) with its
        token from the hosted page.'
      properties:
        method:
          allOf:
          - $ref: '#/components/schemas/ExtraChargeMethodEnum'
          default: card
        payment_token:
          type: string
          description: 'From the gateway''s hosted fields or page. Sandbox: tok_decline
            declines.'
          maxLength: 255
        channel:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/ChannelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        upi_id:
          type: string
          default: ''
          pattern: ^[A-Za-z0-9._-]{2,64}@[A-Za-z0-9]{2,32}$
        idempotency_key:
          type: string
          description: 'Pay.Idempotent: one key per attempt; a repeat never charges
            or refunds twice.'
          pattern: ^[A-Za-z0-9_-]{8,40}$
        password:
          type: string
          writeOnly: true
          description: 'SE-9: re-authentication before a payment or a refund.'
      required:
      - idempotency_key
      - password
      - payment_token
