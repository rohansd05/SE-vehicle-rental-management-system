      - pickup_datetime
      - return_datetime
    ModifyBooking:
      type: object
      description: |-
        Book.Modify: the new period, pickup branch and add-ons; `vehicle` takes the
        alternative offered when the booked vehicle is not free (UC 4 extension 3a).
      properties:
        pickup_datetime:
          type: string
          format: date-time
        return_datetime:
          type: string
          format: date-time
        pickup_branch:
          type: integer
        add_ons:
          type: array
          items:
            $ref: '#/components/schemas/AddOnRequest'
        vehicle:
          type: integer
          nullable: true
        method:
          allOf:
          - $ref: '#/components/schemas/ExtraChargeMethodEnum'
          default: card
        payment_token:
          type: string
          default: ''
          maxLength: 255
