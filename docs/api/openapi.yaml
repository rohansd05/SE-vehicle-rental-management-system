          readOnly: true
          description: The latest document of its type; older rows are history.
        file_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - current
      - document_number
      - document_type
      - expiry_date
      - file_url
      - id
      - state
      - valid_from
    AdminPhoto:
      type: object
