openapi: 3.0.3
info:
  title: Vehicle Rental Management System API
  version: 1.0.0
  description: REST + JSON API documented with OpenAPI 3.0 (CO-4).
paths:
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: Returns the access token (5 minutes) and the user, and sets the
        refresh cookie (30 minutes). The refresh token is never in a response body
        (D21). It is set as the httpOnly, SameSite=Strict cookie `vrms_refresh`, scoped
        to /api/v1/auth/, which the browser sends back automatically. Keep the access
        token in memory only.
      summary: Sign in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              SignIn:
                value:
                  email: customer@vrms.test
                  password: Demo@1234
                summary: Sign in
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Account locked (SE-8)
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: No request body and no access token needed. Blacklists the refresh
        token in the cookie, if any, and always clears the cookie. The refresh token
        is never in a response body (D21). It is set as the httpOnly, SameSite=Strict
        cookie `vrms_refresh`, scoped to /api/v1/auth/, which the browser sends back
        automatically. Keep the access token in memory only.
      summary: Sign out
      tags:
      - Authentication
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change/:
    post:
      operationId: api_v1_auth_password_change_create
      description: Change the password; every session ends and the user signs in again.
      summary: Change password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
            examples:
              ChangePassword:
                value:
                  current_password: Demo@1234
                  new_password: N3w!Passw0rd-2026
                summary: Change password
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          description: Invalid
  /api/v1/auth/refresh/:
    post:
      operationId: api_v1_auth_refresh_create
      description: No request body. Reads the refresh cookie, blacklists it, sets
        a new one and returns a new access token and the user (also used to restore
        a session when the page loads). 401 with code `session_ended` when the cookie
        is missing, expired or already used; the cookie is then cleared. The refresh
        token is never in a response body (D21). It is set as the httpOnly, SameSite=Strict
        cookie `vrms_refresh`, scoped to /api/v1/auth/, which the browser sends back
        automatically. Keep the access token in memory only.
      summary: Refresh the access token
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      description: 'SE-7: create an inactive customer account and send an OTP by SMS.'
      summary: Register as a customer
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              Register:
                value:
                  email: asha@example.com
                  password: Str0ng!Passw0rd
                  name: Asha Rao
                  mobile_no: '+919812345678'
                  address: 14 Hill Road, Bandra (W), Mumbai 400050
                  date_of_birth: '1996-04-12'
                  emergency_contact_name: Ravi Rao
                  emergency_contact_mobile: '+919812300000'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          description: Invalid
  /api/v1/auth/resend-otp/:
    post:
      operationId: api_v1_auth_resend_otp_create
      description: Send a new registration code; the previous one stops working.
      summary: Resend the registration OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
            examples:
              Resend:
                value:
                  email: asha@example.com
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Email'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Email'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/verify-otp/:
    post:
      operationId: api_v1_auth_verify_otp_create
      description: 'SE-7: verify the registration code and activate the account.'
      summary: Verify the registration OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
            examples:
              Verify:
                value:
                  email: asha@example.com
                  code: '123456'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: api_v1_bookings_list
      description: History.View (GET, newest pickup first) and Book.Create (POST,
        customers only).
      summary: List bookings (History.View, History.Privacy)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: pickup_from
        schema:
          type: string
          format: date
      - in: query
        name: pickup_to
        schema:
          type: string
          format: date
      - in: query
        name: reference
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - Active
          - Cancelled
          - Completed
          - Confirmed
          - Draft
          - No-show
          - Pending Payment
        description: |-
          * `Draft` - Draft
          * `Pending Payment` - Pending Payment
          * `Confirmed` - Confirmed
          * `Active` - Active
          * `Completed` - Completed
          * `Cancelled` - Cancelled
          * `No-show` - No-show
      - in: query
        name: vehicle_type
        schema:
          type: string
          enum:
          - Car
          - Two-Wheeler
        description: |-
          * `Car` - Car
          * `Two-Wheeler` - Two-Wheeler
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: api_v1_bookings_create
      description: 'Exp 4 sequence 1: checks the period (BR-5), the terms (Book.Quote.Terms,
        SA-1), eligibility (Licence.is_valid(): BR-2, BR-3, BR-4), availability (Vehicle.check_availability(),
        BR-1) and prices it (Tariff.calculate_price(), BR-6). The booking is Pending
        Payment with a 15-minute hold (Book.Hold). Refusals: 400 with `code` licence_not_verified,
        licence_expired, licence_expires_before_return, licence_category, under_age,
        customer_blacklisted or outstanding_due; 409 `vehicle_unavailable`.'
      summary: Create a booking and hold the vehicle (Booking.create_booking())
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBooking'
            examples:
              TwoDaysWithAChildSeat:
                value:
                  vehicle: 12
                  pickup_datetime: '2026-10-20T04:30:00Z'
                  return_datetime: '2026-10-22T04:30:00Z'
                  add_ons:
                  - add_on: 3
                    quantity: 1
                  discount_code: WELCOME10
                  terms_accepted: true
                  safety_notice_acknowledged: false
                summary: Two days with a child seat
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateBooking'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: api_v1_bookings_retrieve
      summary: A booking with its itemised price
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    get:
      operationId: api_v1_bookings_cancel_retrieve
      description: Book.Cancel and Book.Cancel.Release (Exp 3 Booking.cancel_booking()).
      summary: The refund if this booking is cancelled now (Book.Cancel, BR-8)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationQuote'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
    post:
      operationId: api_v1_bookings_cancel_create
      description: 'SE-9: the password is required. `expected_refund` is the total
        refund the customer was shown; 409 `refund_changed` if BR-8 now gives another
        amount. The vehicle is released, the booking Cancelled, the rental share (BR-8)
        and the whole deposit refunded through the payments service (a refund above
        the automatic approval limit waits for an Administrator, UC 13), and the customer
        and the branch notified. An unpaid cash-at-collection booking is cancelled
        with no refund. 409 `invalid_state` for an Active or other booking.'
      summary: Cancel a booking before collection (Book.Cancel, Book.Cancel.Release)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBooking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelBooking'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/{id}/cash/:
    post:
      operationId: api_v1_bookings_cash_create
      description: 'Only Branch Staff of the pickup branch: the CashPayment names
        them. SE-9: their password is required. `amount_received` must equal the rental
        plus the deposit. The booking is confirmed in the same single transaction
        as a card payment. 409 `invalid_state`, `hold_expired`, `price_changed` or
        `discount_unavailable`. The same idempotency key never records the cash twice.'
      summary: Record the cash received and confirm the booking (BR-9, Book.Done)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCash'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordCash'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordCash'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/{id}/extend/:
    post:
      operationId: api_v1_bookings_extend_create
      description: 'SE-9: the password is required. Only an Active booking, when no
        booking of the vehicle conflicts (409 `vehicle_unavailable`) and the whole
        rental stays within 30 days (BR-5, 400). The extra charge is authorised before
        the new return time takes effect (402 `payment_declined` changes nothing);
        409 `price_changed` if it differs from `expected_charge`.'
      summary: Extend an active rental (Book.Extend)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendBooking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExtendBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExtendBooking'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/{id}/extend/quote/:
    post:
      operationId: api_v1_bookings_extend_quote_create
      description: 'Book.Extend: the extra charge for a later return; nothing is saved.'
      summary: Price an extension of an active rental (Book.Extend, BR-5)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionQuote'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/{id}/hold/:
    post:
      operationId: api_v1_bookings_hold_create
      description: Rechecks eligibility and availability and re-prices at today's
        tariff.
      summary: Hold a Draft booking again (Book.Hold.Expire)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/{id}/invoice/:
    get:
      operationId: api_v1_bookings_invoice_retrieve
      description: 'Pay.Invoice: the issued invoice as a PDF (History.Download).'
      summary: Download the invoice PDF
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          description: The invoice PDF.
  /api/v1/bookings/{id}/modify/:
    post:
      operationId: api_v1_bookings_modify_create
      description: 'SE-9: the password is required. `expected_charge` and `expected_refund`
        are the amounts the customer was shown; 409 `price_changed` otherwise. An
        extra charge is authorised at once by card or on-line (402 `payment_declined`
        changes nothing); an excess is refunded under BR-8. 409 `vehicle_unavailable`,
        `modification_cutoff` or `invalid_state`. The same idempotency key never charges
        or refunds twice (Pay.Idempotent).'
      summary: Modify a confirmed booking (Book.Modify, Book.Modify.Price)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyBooking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModifyBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModifyBooking'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/{id}/modify/quote/:
    post:
      operationId: api_v1_bookings_modify_quote_create
      description: Rechecks BR-5 and the licence (BR-2) and reprices at the booking's
        own tariff (BR-13). `extra_charge` is charged at once; `refund_amount` is
        the excess refunded under BR-8. When the vehicle is not free, `vehicle_free`
        is false and `alternatives` lists vehicles of the same category at the same
        tariff (UC 4 extension 3a). 409 `modification_cutoff` less than 12 hours before
        pickup.
      summary: Price a change of period, branch or add-ons (Book.Modify, Book.Modify.Price)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModificationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModificationQuote'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/{id}/pay/:
    post:
      operationId: api_v1_bookings_pay_create
      description: 'SE-9: the customer''s password is required. `method` card or online
        (UPI, net banking, wallet; D6): one gateway authorisation for the rental and
        the deposit; success is Confirmed, with booking reference, pickup code, transaction
        id and invoice. `method` cash (BR-9): the booking stays Pending Payment, held
        for the collection, until branch staff record the cash. 402 `payment_declined`:
        the hold is kept. 409 `hold_expired`, `price_changed`, `discount_unavailable`
        or `invalid_state`. Repeating the same idempotency key never charges twice
        (Pay.Idempotent).'
      summary: Pay for a held booking and confirm it (Pay.Method, Pay.Authorize, Book.Done)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayBooking'
            examples:
              SandboxCard:
                value:
                  payment_token: tok_visa
                  idempotency_key: pay-7f3a9c21
                  password: …
                summary: Sandbox card
              SandboxUPI:
                value:
                  method: online
                  channel: UPI
                  upi_id: asha@okbank
                  payment_token: tok_upi
                  idempotency_key: pay-7f3a9c22
                  password: …
                summary: Sandbox UPI
              CashAtCollection:
                value:
                  method: cash
                  idempotency_key: pay-7f3a9c23
                  password: …
                summary: Cash at collection
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayBooking'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
          description: ''
  /api/v1/bookings/awaiting-cash/:
    get:
      operationId: api_v1_bookings_awaiting_cash_list
      description: 'BR-9: the cash desk''s list of collections to be paid in cash.'
      summary: Bookings waiting for cash at collection (BR-9)
      parameters:
      - name: page
