          default: ''
          oneOf:
          - $ref: '#/components/schemas/ChannelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        upi_id:
          type: string
          default: ''
          pattern: ^[A-Za-z0-9._-]{2,64}@[A-Za-z0-9]{2,32}$
        idempotency_key:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,40}$
        password:
          type: string
          writeOnly: true
        expected_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        expected_refund:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
