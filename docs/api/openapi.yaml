  /api/v1/pricing/quote/:
    post:
      operationId: api_v1_pricing_quote_create
      description: Base charge (whole days from 24 hours, otherwise whole hours after
        a 15-minute grace), add-ons per billed day, the discount, then tax on the
        discounted amount (D14 rate). The security deposit (BR-3) is separate and
        not part of `total_payable`. Usage-based charges arise only at return. Nothing
        is saved.
      summary: Quote a booking (Tariff.calculate_price(), BR-6)
      tags:
      - Pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              TwoDaysWithAChildSeatAndACode:
                value:
                  vehicle: 12
                  pickup_datetime: '2026-10-20T04:30:00Z'
                  return_datetime: '2026-10-22T04:30:00Z'
                  add_ons:
                  - add_on: 3
                    quantity: 1
                  discount_code: WELCOME10
                summary: Two days with a child seat and a code
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
