  /api/v1/rentals/returns/{id}/:
    get:
      operationId: api_v1_rentals_returns_retrieve
      description: The booking, its handover condition report (whose photos are shown
        beside the return photos, Return.Checklist), the BR-10 to BR-12 terms, the
        rental already paid (extensions included, never charged again) and how the
        deposit was paid. `refusals` says why a booking cannot be returned (only an
        Active one can). Once returned, `return_report` and `settlement` hold the
        signed settlement, its refund status (Pending Approval above the approval
        limit) and any due.
      summary: A booking's return checklist (UC 8 step 1)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Return
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnDetail'
          description: ''
  /api/v1/rentals/returns/{id}/complete/:
    post:
      operationId: api_v1_rentals_returns_complete_create
      description: 'Exp 4 sequence 2 in one transaction: the return condition report
        with one photo of each side, signed by the customer to acknowledge the settlement;
        the charges deducted from the deposit and put on the invoice as a debit note;
        the balance refunded (BR-14) or the excess recorded as a due (Pay.Dues); the
        vehicle''s odometer updated; a maintenance job raised if the vehicle is flagged
        (Return.Flag); the booking Completed and the vehicle Available, or Under Maintenance
        if flagged unfit. If the charges differ from `expected_total` the answer is
        409 `settlement_changed`. Sending it again for a returned booking returns
        the same result and moves no money.'
      summary: Record, settle and complete a return (BranchStaff.return_vehicle())
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Return
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Return'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRefused'
          description: Not an Active booking
  /api/v1/rentals/returns/{id}/quote/:
    post:
      operationId: api_v1_rentals_returns_quote_create
      description: 'From the return readings and the charges the staff member enters:
        the late return (BR-10), excess kilometres (BR-11), fuel or charge shortfall
        (BR-12), accessories not returned, damage and tax as separate lines, then
        what is deducted from the deposit, refunded (BR-14) or left as a due. Nothing
        is saved. `override_required` is true when the distance needs a supervisor''s
        approval (Return.Odometer). A reading below the handover reading is 400.'
      summary: Compute the itemised settlement (UC 8 step 3, Return.Charges)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Return
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnReadings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReturnReadings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnReadings'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnQuote'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRefused'
          description: Not an Active booking
