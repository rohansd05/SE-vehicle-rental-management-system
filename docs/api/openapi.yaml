      description: 'Confirmed bookings collected at the caller''s branch, earliest
        first: `when=today` (default) or `when=upcoming`. With `q`, finds a Confirmed
        booking on any date by its booking reference, its pickup code or the customer''s
        mobile number; `when` is then ignored. The pickup code itself is never returned.'
