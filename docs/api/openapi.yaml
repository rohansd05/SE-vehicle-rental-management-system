  /api/v1/fleet/search/:
    get:
      operationId: api_v1_fleet_search_list
      description: 'Vehicles at the pickup branch that can be booked for the whole
        period: status Available (Appendix B; so never Under Maintenance, Unsafe or
        Retired), no Pending Payment, Confirmed or Active booking within the period
        plus the 60-minute turnaround buffer (BR-1, Book.Hold), no Scheduled or In
        Progress maintenance window in the period, not overdue for its preventive
        service by date or distance (SA-2, BR-15), and an availability date on or
        before the pickup (Fleet.Add). The period must be 4 hours to 30 days (BR-5)
        and start in the future; otherwise the answer is 400 with the message on the
        field. Search.Filter narrows the results and `sort` orders them by price or
        rating. Each result carries `estimate` (Search.Price): the base charge plus
        tax at the tariff in force on the pickup date, excluding add-ons, discounts
        and usage-based charges; null if no tariff is in force. `min_price`/`max_price`
        apply to that estimate.'
      summary: Search available vehicles (Search.Available)
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
        required: true
      - in: query
        name: brand
        schema:
          type: string
          maxLength: 64
          minLength: 1
      - in: query
        name: category
        schema:
          type: integer
          nullable: true
      - in: query
        name: fuel_type
        schema:
          enum:
          - Petrol
          - Diesel
          - CNG
          - Electric
          type: string
          minLength: 1
        description: |-
          * `Petrol` - Petrol
          * `Diesel` - Diesel
          * `CNG` - CNG
          * `Electric` - Electric
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: min_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: min_rating
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
      - in: query
        name: min_seats
        schema:
          type: integer
          maximum: 20
          minimum: 1
      - in: query
        name: model
        schema:
          type: string
          maxLength: 64
          minLength: 1
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: pickup_datetime
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: return_datetime
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: sort
        schema:
          enum:
          - price
          - -price
          - rating
          type: string
          minLength: 1
        description: |-
          price (lowest first), -price, or rating.

          * `price` - price
          * `-price` - -price
          * `rating` - rating
      - in: query
        name: transmission
        schema:
          enum:
          - Manual
          - Automatic
          type: string
          minLength: 1
        description: |-
          * `Manual` - Manual
          * `Automatic` - Automatic
      - in: query
        name: vehicle_type
        schema:
          enum:
          - Car
          - Two-Wheeler
          type: string
          minLength: 1
        description: |-
          * `Car` - Car
          * `Two-Wheeler` - Two-Wheeler
      tags:
      - Search and availability
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAvailableVehicleList'
          description: ''
