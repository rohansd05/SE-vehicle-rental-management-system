          - $ref: '#/components/schemas/Technician'
          readOnly: true
          nullable: true
        reported_problem:
          type: string
          readOnly: true
        reported_by:
          type: string
          readOnly: true
        scheduled_from:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        scheduled_to:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        service_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        odometer_at_service:
          type: integer
          readOnly: true
          nullable: true
        work_description:
          type: string
          readOnly: true
        labour_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        downtime_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        total_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PartUsed'
          readOnly: true
        missing_work:
          type: array
