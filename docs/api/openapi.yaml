openapi: 3.0.3
info:
  title: Vehicle Rental Management System API
  version: 1.0.0
  description: REST + JSON API documented with OpenAPI 3.0 (CO-4).
paths:
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: Returns the access token (5 minutes) and the user, and sets the
        refresh cookie (30 minutes). The refresh token is never in a response body
        (D21). It is set as the httpOnly, SameSite=Strict cookie `vrms_refresh`, scoped
        to /api/v1/auth/, which the browser sends back automatically. Keep the access
        token in memory only.
      summary: Sign in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              SignIn:
                value:
                  email: customer@vrms.test
                  password: Demo@1234
                summary: Sign in
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Account locked (SE-8)
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: No request body and no access token needed. Blacklists the refresh
        token in the cookie, if any, and always clears the cookie. The refresh token
        is never in a response body (D21). It is set as the httpOnly, SameSite=Strict
        cookie `vrms_refresh`, scoped to /api/v1/auth/, which the browser sends back
        automatically. Keep the access token in memory only.
      summary: Sign out
      tags:
      - Authentication
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change/:
    post:
      operationId: api_v1_auth_password_change_create
      description: Change the password; every session ends and the user signs in again.
      summary: Change password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
            examples:
              ChangePassword:
                value:
                  current_password: Demo@1234
                  new_password: N3w!Passw0rd-2026
                summary: Change password
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          description: Invalid
  /api/v1/auth/refresh/:
    post:
      operationId: api_v1_auth_refresh_create
      description: No request body. Reads the refresh cookie, blacklists it, sets
        a new one and returns a new access token and the user (also used to restore
        a session when the page loads). 401 with code `session_ended` when the cookie
        is missing, expired or already used; the cookie is then cleared. The refresh
        token is never in a response body (D21). It is set as the httpOnly, SameSite=Strict
        cookie `vrms_refresh`, scoped to /api/v1/auth/, which the browser sends back
        automatically. Keep the access token in memory only.
      summary: Refresh the access token
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      description: 'SE-7: create an inactive customer account and send an OTP by SMS.'
      summary: Register as a customer
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              Register:
                value:
                  email: asha@example.com
                  password: Str0ng!Passw0rd
                  name: Asha Rao
                  mobile_no: '+919812345678'
                  address: 14 Hill Road, Bandra (W), Mumbai 400050
                  date_of_birth: '1996-04-12'
                  emergency_contact_name: Ravi Rao
                  emergency_contact_mobile: '+919812300000'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          description: Invalid
  /api/v1/auth/resend-otp/:
    post:
      operationId: api_v1_auth_resend_otp_create
      description: Send a new registration code; the previous one stops working.
      summary: Resend the registration OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
            examples:
              Resend:
                value:
                  email: asha@example.com
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Email'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Email'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/verify-otp/:
    post:
      operationId: api_v1_auth_verify_otp_create
      description: 'SE-7: verify the registration code and activate the account.'
      summary: Verify the registration OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
            examples:
              Verify:
                value:
                  email: asha@example.com
                  code: '123456'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/files/{token}/:
    get:
      operationId: api_v1_files_retrieve
      description: |-
        Serve one stored file to whoever holds a valid, unexpired link.

        The signature is the credential, so no session or token is needed; a
        forged or expired link gets a 404 that says nothing about the file.
      summary: Download a stored file through a signed link (SI-3)
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Files
      security:
      - {}
      responses:
        '200':
          description: The file
        '404':
          description: No response body
  /api/v1/fleet/branches/:
    get:
      operationId: api_v1_fleet_branches_list
      description: The pickup branches a search can start from.
      summary: Branches (pickup locations)
      tags:
      - Search and availability
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/fleet/categories/:
    get:
      operationId: api_v1_fleet_categories_list
      description: Appendix A vehicle categories, for the search filter (Search.Filter).
      summary: Vehicle categories
      tags:
      - Search and availability
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleCategory'
          description: ''
  /api/v1/fleet/search/:
    get:
      operationId: api_v1_fleet_search_list
      description: 'Vehicles at the pickup branch that can be booked for the whole
        period: status Available (Appendix B), no Pending Payment, Confirmed or Active
        booking within the period plus the 60-minute turnaround buffer (BR-1, Book.Hold),
        no Scheduled or In Progress maintenance window in the period, and an availability
        date on or before the pickup (Fleet.Add). The period must be 4 hours to 30
        days (BR-5) and start in the future; otherwise the answer is 400 with the
        message on the field.'
      summary: Search available vehicles (Search.Available)
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
        required: true
      - in: query
        name: category
        schema:
          type: integer
          nullable: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: pickup_datetime
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: return_datetime
        schema:
          type: string
          format: date-time
        required: true
      tags:
      - Search and availability
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAvailableVehicleList'
          description: ''
  /api/v1/health/:
    get:
      operationId: api_v1_health_retrieve
      description: |-
        Liveness and readiness check, also the source of the agency name (D7).

        Public on purpose: used by deployment health checks and by the home page
        before anyone signs in. It exposes no user or business data.
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/licence/:
    get:
      operationId: api_v1_licence_retrieve
      description: 'The customer''s own driving licence (Book.Eligible.No: submit
        a licence now).'
      summary: My driving licence
      tags:
      - Licence
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Licence'
          description: ''
    post:
      operationId: api_v1_licence_create
      description: 'Multipart form. Both images are required (Appendix A front and
        back image): JPG or PNG, at most 5 MB. An already-expired licence is refused
        (BR-2). The licence then awaits verification by branch staff or an administrator.'
      summary: Submit or resubmit my driving licence
      tags:
      - Licence
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LicenceSubmit'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Licence'
          description: ''
        '400':
          description: Invalid
  /api/v1/licences/:
    get:
      operationId: api_v1_licences_list
      description: |-
        Licences awaiting verification, oldest first.

        Licences are not tied to a branch, so every branch's staff see the queue.
      summary: Licences pending verification
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Licence verification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLicenceReviewList'
          description: ''
  /api/v1/licences/{id}/approve/:
    post:
      operationId: api_v1_licences_approve_create
      summary: Approve a licence
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Licence verification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenceReview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          description: No response body
  /api/v1/licences/{id}/reject/:
    post:
      operationId: api_v1_licences_reject_create
      summary: Reject a licence (a reason is required)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Licence verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenceReject'
            examples:
              Reject:
                value:
                  reason: The photograph of the back of the licence is unreadable.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LicenceReject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LicenceReject'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenceReview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          description: No response body
  /api/v1/maintenance/clearances/:
    get:
      operationId: api_v1_maintenance_clearances_list
      description: 'BR-16: jobs whose work is complete on an Unsafe vehicle, oldest
        first.'
      summary: Jobs awaiting Unsafe-flag clearance
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Maintenance clearance (BR-16)
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaintenanceJobList'
          description: ''
  /api/v1/maintenance/jobs/:
    get:
      operationId: api_v1_maintenance_jobs_list
      description: Branch Staff and Branch Managers see their branch's jobs, a technician
        sees only the jobs assigned to them, an Administrator sees all. Filter with
        `status`, `vehicle`, `severity` and `job_type`.
      summary: List maintenance jobs
      parameters:
      - in: query
        name: job_type
        schema:
          type: string
          enum:
          - Cleaning
          - Corrective
          - Documentation
          - Inspection
          - Preventive
        description: |-
          * `Preventive` - Preventive
          * `Corrective` - Corrective
          * `Inspection` - Inspection
          * `Cleaning` - Cleaning
          * `Documentation` - Documentation
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - Critical
          - High
          - Low
          - Medium
        description: |-
          * `Low` - Low
          * `Medium` - Medium
          * `High` - High
          * `Critical` - Critical
      - in: query
        name: status
        schema:
          type: string
          enum:
          - Cancelled
          - Completed
          - In Progress
          - Reported
          - Scheduled
        description: |-
          * `Reported` - Reported
          * `Scheduled` - Scheduled
          * `In Progress` - In Progress
          * `Completed` - Completed
          * `Cancelled` - Cancelled
      - in: query
        name: vehicle
        schema:
          type: integer
      tags:
      - Maintenance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaintenanceJobList'
          description: ''
    post:
      operationId: api_v1_maintenance_jobs_create
      description: Creates a Reported job. `flag_unsafe` flags the vehicle Unsafe
        at once (Maint.Unsafe); otherwise the vehicle status changes only when the
        job is scheduled (Appendix B).
      summary: Report a fault (Maint.Create)
      tags:
      - Maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportJob'
            examples:
              ReportAFault:
                value:
                  vehicle: 12
                  job_type: Corrective
                  severity: High
                  reported_problem: Brake pedal feels soft; pulls to the left under
                    braking.
                  flag_unsafe: true
                summary: Report a fault
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/maintenance/jobs/{id}/:
    get:
      operationId: api_v1_maintenance_jobs_retrieve
      summary: A maintenance job with its record and parts
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Maintenance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceJob'
          description: ''
  /api/v1/maintenance/jobs/{id}/approve-clearance/:
    post:
      operationId: api_v1_maintenance_jobs_approve_clearance_create
      description: The vehicle becomes Available, the Administrator is recorded as
        `closed_by`, the next service due is computed (BR-15) and the job is Completed.
      summary: Clear the Unsafe flag and complete the job (BR-16)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Maintenance clearance (BR-16)
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/maintenance/jobs/{id}/cancel/:
    post:
      operationId: api_v1_maintenance_jobs_cancel_create
      description: POST on one job the caller can see.
      summary: Cancel a Reported or Scheduled job
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelJob'
            examples:
              Cancel:
                value:
                  reason: Duplicate of job 41.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/maintenance/jobs/{id}/complete/:
    post:
      operationId: api_v1_maintenance_jobs_complete_create
      description: 'Validates the recorded work, parts and cost; if incomplete the
        answer is 400 with `code: work_incomplete` ("record work first"). If the vehicle
        is flagged Unsafe the job stays In Progress with `awaiting_clearance: true`
        until an Administrator approves it (BR-16). Otherwise the vehicle becomes
        Available, the next service due is computed (BR-15) and the job is Completed.'
      summary: Complete a job (Exp 4 sequence 3, MaintenanceJob.complete_job())
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Maintenance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkIncomplete'
          description: ''
  /api/v1/maintenance/jobs/{id}/record/:
    put:
      operationId: api_v1_maintenance_jobs_record_update
      description: 'Replaces the job''s record. The total cost is computed: labour
        plus every part''s quantity x unit cost.'
      summary: Record the work, parts, cost and downtime (Maint.Record)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordWork'
            examples:
              RecordWork:
                value:
                  service_date: '2026-10-14'
                  odometer_at_service: 15230
                  work_description: Replaced front brake pads; bled the brake lines.
                  labour_cost: '800.00'
                  downtime_hours: '6.50'
                  parts:
                  - part_name: Brake pads (front)
                    quantity: '1'
                    unit_cost: '1450.00'
                  - part_name: Brake fluid DOT4
                    quantity: '0.5'
                    unit_cost: '600.00'
                summary: Record work
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordWork'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordWork'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/maintenance/jobs/{id}/schedule/:
    post:
      operationId: api_v1_maintenance_jobs_schedule_create
      description: 'Reported -> Scheduled; an Available vehicle goes Under Maintenance.
        If the period overlaps Confirmed bookings the answer is 409 listing them;
        send again with `confirm_conflicts: true` to go ahead (Maint.Conflict).'
      summary: Assign a technician and a period (Maint.Schedule)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleJob'
            examples:
              Schedule:
                value:
                  technician: 3
                  scheduled_from: '2026-10-14T04:30:00Z'
                  scheduled_to: '2026-10-14T12:30:00Z'
                  confirm_conflicts: false
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScheduleJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScheduleJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleConflict'
          description: ''
  /api/v1/maintenance/jobs/{id}/start/:
    post:
      operationId: api_v1_maintenance_jobs_start_create
      description: POST on one job the caller can see.
      summary: Start a scheduled job (Scheduled -> In Progress)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Maintenance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/maintenance/technicians/:
    get:
      operationId: api_v1_maintenance_technicians_list
      description: Technicians a job can be assigned to (Appendix A "assigned to").
      summary: Active maintenance technicians
      tags:
      - Maintenance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Technician'
          description: ''
  /api/v1/maintenance/vehicles/:
    get:
      operationId: api_v1_maintenance_vehicles_list
      description: Vehicles a fault can be reported on, with status and BR-15 next
        service due.
      summary: Vehicles of the caller's branch (all for an Administrator)
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - Available
          - On Rent
          - Retired
          - Under Maintenance
          - Unsafe
      tags:
      - Maintenance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceVehicle'
          description: ''
  /api/v1/maintenance/vehicles/{id}/history/:
    get:
      operationId: api_v1_maintenance_vehicles_history_list
      description: |-
        Maint.History: every job on a vehicle, newest first, for staff,
        technicians and Administrators.
      summary: Maintenance history of a vehicle (Maint.History)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Maintenance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaintenanceJobList'
          description: ''
        '404':
          description: No response body
  /api/v1/me/:
    get:
      operationId: api_v1_me_retrieve
      description: The signed-in user's own profile.
      summary: My profile
      tags:
      - Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: api_v1_me_partial_update
      description: Name and address change at once. A new mobile number is applied
        only after the code sent to it is confirmed at /api/v1/me/verify-mobile/ (SE-7).
      summary: Update my profile
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
            examples:
              ChangeMobile:
                value:
                  mobile_no: '+919898989898'
                summary: Change mobile
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
          description: ''
  /api/v1/me/verify-mobile/:
    post:
      operationId: api_v1_me_verify_mobile_create
      description: 'SE-7: confirm a new mobile number with the code sent to it.'
      summary: Confirm a new mobile number
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPCode'
            examples:
              Confirm:
                value:
                  code: '123456'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPCode'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      description: 'Sign-in and refresh response (D21): the refresh token is in the
        cookie only.'
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access
      - user
    AvailableVehicle:
      type: object
      description: 'One search result: the specification a customer chooses by (Search.Filter
        fields).'
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: string
          maxLength: 64
        model:
          type: string
          maxLength: 64
        year:
          type: integer
          maximum: 2100
          minimum: 1990
        colour:
          type: string
          maxLength: 32
        fuel_type:
          $ref: '#/components/schemas/FuelTypeEnum'
        vehicle_type:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        category_id:
          type: integer
          readOnly: true
        home_branch:
          type: string
          readOnly: true
        home_branch_id:
          type: integer
          readOnly: true
        transmission:
          type: string
          nullable: true
          readOnly: true
        seating_capacity:
          type: integer
          nullable: true
          readOnly: true
        engine_cc:
          type: integer
          nullable: true
          readOnly: true
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        last_service_date:
          type: string
          format: date
          nullable: true
      required:
      - average_rating
      - brand
      - category
      - category_id
      - colour
      - engine_cc
      - fuel_type
      - home_branch
      - home_branch_id
      - id
      - model
      - seating_capacity
      - transmission
      - vehicle_type
      - year
    Branch:
      type: object
      properties:
        branch_id:
          type: integer
          readOnly: true
        branch_name:
          type: string
          maxLength: 100
        address:
          type: string
      required:
      - address
      - branch_id
      - branch_name
    CancelJob:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
      required:
      - reason
    CategoriesEnum:
      enum:
      - Car
      - Two-Wheeler
      type: string
      description: |-
        * `Car` - Car
        * `Two-Wheeler` - Two-Wheeler
    ConflictBooking:
      type: object
      properties:
        booking_reference:
          type: string
        pickup_datetime:
          type: string
          format: date-time
        return_datetime:
          type: string
          format: date-time
      required:
      - booking_reference
      - pickup_datetime
      - return_datetime
    DatabaseEnum:
      enum:
      - ok
      - unreachable
      type: string
      description: |-
        * `ok` - ok
        * `unreachable` - unreachable
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Email:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    FuelTypeEnum:
      enum:
      - Petrol
      - Diesel
      - CNG
      - Electric
      type: string
      description: |-
        * `Petrol` - Petrol
        * `Diesel` - Diesel
        * `CNG` - CNG
        * `Electric` - Electric
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        database:
