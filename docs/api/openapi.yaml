    get:
      operationId: api_v1_rentals_returns_list
      description: Active bookings collected at the caller's branch and due back today
        or overdue, earliest return first. With `q`, finds an Active booking on any
        date by its booking reference or the customer's mobile number.
      summary: Returns due at your branch, or find a rental in progress
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
