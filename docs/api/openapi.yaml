        `status`, `vehicle`, `severity` and `job_type`.
      summary: List maintenance jobs
      parameters:
      - in: query
        name: job_type
        schema:
          type: string
          enum:
          - Cleaning
          - Corrective
          - Documentation
          - Inspection
          - Preventive
        description: |-
          * `Preventive` - Preventive
          * `Corrective` - Corrective
          * `Inspection` - Inspection
          * `Cleaning` - Cleaning
          * `Documentation` - Documentation
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - Critical
          - High
          - Low
          - Medium
        description: |-
          * `Low` - Low
          * `Medium` - Medium
          * `High` - High
          * `Critical` - Critical
      - in: query
        name: status
        schema:
          type: string
          enum:
          - Cancelled
          - Completed
          - In Progress
          - Reported
          - Scheduled
        description: |-
          * `Reported` - Reported
          * `Scheduled` - Scheduled
          * `In Progress` - In Progress
          * `Completed` - Completed
          * `Cancelled` - Cancelled
