                  password: …
                summary: Sandbox card
              SandboxUPI:
                value:
                  method: online
                  channel: UPI
                  upi_id: asha@okbank
                  payment_token: tok_upi
                  idempotency_key: pay-7f3a9c22
                  password: …
                summary: Sandbox UPI
              CashAtCollection:
                value:
                  method: cash
                  idempotency_key: pay-7f3a9c23
                  password: …
