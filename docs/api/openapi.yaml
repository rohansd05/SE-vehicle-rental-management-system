      - free_km_allowance_per_day
      - fuel_shortfall_service_charge_percent
      - late_return_daily_cap
      - late_return_full_day_after_hours
      - late_return_grace_minutes
      - late_return_hourly_rate
      - no_show_retained_percent
    Reauthenticated:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          description: 'SE-9: re-authentication before a payment or a refund.'
      required:
      - password
    RecordCash:
      type: object
      description: 'BR-9: the cash a named branch staff member received at collection;
        SE-9.'
      properties:
        amount_received:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Must equal the rental plus the deposit.
        idempotency_key:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,40}$
        password:
          type: string
          writeOnly: true
      required:
      - amount_received
      - idempotency_key
      - password
    RecordWork:
      type: object
      description: Maint.Record.
      properties:
        service_date:
          type: string
          format: date
        odometer_at_service:
          type: integer
          minimum: 0
        work_description:
          type: string
          maxLength: 5000
        labour_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        downtime_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PartInput'
      required:
      - downtime_hours
      - labour_cost
      - odometer_at_service
      - parts
      - service_date
      - work_description
    Refund:
      type: object
      description: A refund request as the Administrator queue (UC 13), staff and
        the customer see it.
      properties:
        id:
          type: integer
          readOnly: true
        booking_id:
          type: integer
          readOnly: true
        booking_reference:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        purpose:
          type: string
          readOnly: true
        method:
          type: string
          readOnly: true
        original_transaction_id:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        reason:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RefundStatusEnum'
          readOnly: true
        requested_by_name:
          type: string
          readOnly: true
          default: ''
        requested_at:
          type: string
          format: date-time
          readOnly: true
        decided_by_name:
          type: string
          readOnly: true
          default: ''
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
        failure_reason:
          type: string
          readOnly: true
        refund_due_by:
          type: string
          format: date
          readOnly: true
          nullable: true
        refund_transaction_id:
          type: string
          nullable: true
          readOnly: true
      required:
      - amount
      - booking_id
      - booking_reference
      - customer_name
      - decided_at
      - decided_by_name
      - failure_reason
      - id
      - method
      - original_transaction_id
      - purpose
      - reason
      - refund_due_by
      - refund_transaction_id
      - rejection_reason
      - requested_at
      - requested_by_name
      - status
    RefundCreate:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reason:
          type: string
          maxLength: 255
        idempotency_key:
          type: string
          description: 'Pay.Idempotent: one key per attempt; a repeat never charges
            or refunds twice.'
          pattern: ^[A-Za-z0-9_-]{8,40}$
        password:
          type: string
          writeOnly: true
          description: 'SE-9: re-authentication before a payment or a refund.'
      required:
      - amount
      - idempotency_key
      - password
      - reason
    RefundStatusEnum:
      enum:
      - Pending Approval
      - Approved
      - Issued
      - Rejected
      - Failed
      type: string
      description: |-
        * `Pending Approval` - Pending Approval
        * `Approved` - Approved
        * `Issued` - Issued
        * `Rejected` - Rejected
        * `Failed` - Failed
    Refusal:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        name:
          type: string
          maxLength: 150
        mobile_no:
          type: string
          pattern: ^\+?[0-9]{10,15}$
          maxLength: 15
        address:
          type: string
        date_of_birth:
          type: string
          format: date
        emergency_contact_name:
          type: string
          maxLength: 150
        emergency_contact_mobile:
          type: string
          pattern: ^\+?[0-9]{10,15}$
          maxLength: 15
      required:
      - address
      - date_of_birth
      - email
      - emergency_contact_mobile
      - emergency_contact_name
      - mobile_no
      - name
      - password
    RegisterResponse:
      type: object
      properties:
        email:
          type: string
          format: email
        detail:
          type: string
      required:
      - detail
      - email
    RejectRefund:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
        password:
          type: string
          writeOnly: true
          description: 'SE-9: re-authentication before a payment or a refund.'
      required:
      - password
      - reason
    ReportJob:
      type: object
      description: Maint.Create; Maint.Unsafe (flag_unsafe).
      properties:
        vehicle:
          type: integer
        job_type:
          $ref: '#/components/schemas/JobTypeEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        reported_problem:
          type: string
          maxLength: 2000
