        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        name:
          type: string
          maxLength: 150
        mobile_no:
          type: string
          pattern: ^\+?[0-9]{10,15}$
          maxLength: 15
        address:
          type: string
        date_of_birth:
          type: string
          format: date
        emergency_contact_name:
          type: string
          maxLength: 150
        emergency_contact_mobile:
          type: string
          pattern: ^\+?[0-9]{10,15}$
          maxLength: 15
      required:
      - address
      - date_of_birth
      - email
      - emergency_contact_mobile
      - emergency_contact_name
      - mobile_no
      - name
      - password
    RegisterResponse:
      type: object
      properties:
        email:
          type: string
          format: email
        detail:
          type: string
      required:
      - detail
      - email
    ReportJob:
      type: object
      description: Maint.Create; Maint.Unsafe (flag_unsafe).
      properties:
        vehicle:
          type: integer
        job_type:
          $ref: '#/components/schemas/JobTypeEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        reported_problem:
          type: string
          maxLength: 2000
        flag_unsafe:
          type: boolean
          default: false
      required:
      - job_type
      - reported_problem
      - severity
      - vehicle
    RoleEnum:
      enum:
      - CUSTOMER
      - BRANCH_STAFF
      - MAINTENANCE_TECHNICIAN
      - ADMINISTRATOR
      - BRANCH_MANAGER
      type: string
      description: |-
        * `CUSTOMER` - Customer
        * `BRANCH_STAFF` - Branch Staff
        * `MAINTENANCE_TECHNICIAN` - Maintenance Technician
        * `ADMINISTRATOR` - Administrator
        * `BRANCH_MANAGER` - Branch Manager
    ScheduleConflict:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/ConflictBooking'
      required:
      - bookings
      - code
      - detail
    ScheduleJob:
      type: object
      description: Maint.Schedule, Maint.Conflict.
      properties:
        technician:
          type: integer
        scheduled_from:
          type: string
          format: date-time
        scheduled_to:
          type: string
          format: date-time
        confirm_conflicts:
          type: boolean
          default: false
      required:
      - scheduled_from
      - scheduled_to
      - technician
    SeverityEnum:
      enum:
      - Low
      - Medium
      - High
      - Critical
      type: string
      description: |-
        * `Low` - Low
        * `Medium` - Medium
        * `High` - High
        * `Critical` - Critical
    Technician:
      type: object
      properties:
        technician_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        workshop:
          type: string
          readOnly: true
      required:
      - name
      - technician_id
      - workshop
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - id
      - name
    VehicleCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        vehicle_type:
          type: string
          readOnly: true
      required:
      - id
      - name
      - vehicle_type
    VerifyOTP:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          maxLength: 6
          pattern: ^[0-9]{6}$
      required:
      - code
      - email
    WorkIncomplete:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        missing:
          type: array
          items:
            type: string
      required:
      - code
      - detail
      - missing
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
