          type: string
          readOnly: true
        issuing_authority:
          type: string
          readOnly: true
        issue_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        expiry_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        categories:
          type: array
